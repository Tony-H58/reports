<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; background: #f0f2f5; color: #1a1a2e; }
  .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
    color: #fff; padding: 32px 40px; display: flex; justify-content: space-between; align-items: flex-end; }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: 2px; }
  .header .sub { font-size: 13px; color: #cbd5e0; margin-top: 6px; }
  .header .date-badge { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);

  .tab-bar { background:#fff; border-bottom: 2px solid #e2e8f0; padding: 0 24px;

  .tab-btn { padding: 12px 24px; border: none; background: transparent; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #4a5568; border-bottom: 3px solid transparent;
    margin-bottom: -2px; transition: all .15s; }
  .tab-btn:hover { color: #0f3460; }
  .tab-btn.active { color: #0f3460; border-bottom-color: #0f3460; }
  .container { max-width: 1600px; margin: 0 auto; padding: 28px 24px; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: #fff; border-radius: 12px; padding: 20px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); border-top: 4px solid var(--accent); }
  .kpi-label { font-size: 12px; color: #4a5568; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
  .kpi-value { font-size: 32px; font-weight: 700; color: var(--accent); }
  .kpi-sub { font-size: 12px; color: #4a5568; margin-top: 4px; }
  .section { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .section-title { font-size: 15px; font-weight: 700; color: #1a202c; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; }
  .section-title span { color: #0f3460; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  canvas { max-height: 280px; }
  .analysis-box { background: #edf2f7; border-left: 4px solid #0f3460; border-radius: 0 8px 8px 0;
    padding: 16px 20px; margin-bottom: 20px; font-size: 14px; line-height: 1.8; color: #2d3748; }
  .analysis-box strong { color: #0f3460; font-size: 14px; }
  .bullet { margin: 4px 0; color: #2d3748; }
  .bullet::before { content: "▸ "; color: #0f3460; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #1a1a2e; color: #e2e8f0; padding: 10px 12px; text-align: center; font-weight: 600; font-size: 13px; }
  td { padding: 9px 12px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 13px; color: #2d3748; }
  tr:nth-child(even) td { background: #f7fafc; }
  tr:hover td { background: #ebf4ff; }
  .footer { text-align: center; color: #4a5568; font-size: 12px; padding: 20px; }
</style>

\">規格</div><div style=\"background:#e2e8f0;border-radius:3px;height:8px;margin-bottom:2px\"><div style=\"background:#744210;width:1%;height:8px;border-radius:3px\"></div></div><div style=\"font-size:12px;color:#744210;font-weight:600\">0.0%</div></td><td style=\"text-align:center;padding:4px 2px\"><div style=\"font-size:12px;color:#2d3748;margin-bottom:3px\">其他</div><div style=\"background:#e2e8f0;border-radius:3px;height:8px;margin-bottom:2px\"><div style=\"background:#4a5568;width:5%;height:8px;border-radius:3px\"></div></div><div style=\"font-size:12px;color:#4a5568;font-weight:600\">4.5%</div></td></tr></table>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px\"><div style=\"width:calc(33.3% - 8px);margin-bottom:8px\"><div style=\"margin-bottom:3px\"><span style=\"background:#c53030;color:#fff;border-radius:3px;padding:1px 6px;font-size:11px\">布疵</span></div><div style=\"padding-left:2px\"><span style=\"display:inline-block;margin-right:10px;white-space:nowrap\"><span style=\"color:#2d3748\">接疋</span><span style=\"color:#c53030;font-weight:600;margin-left:2px\">(18.2%)</span></span><span style=\"display:inline-block;margin-right:10px;white-space:nowrap\"><span style=\"color:#2d3748\">油/髒/色污</span><span style=\"color:#c53030;font-weight:600;margin-left:2px\">(18.2%)</span></span><span style=\"display:inline-block;margin-right:10px;white-space:nowrap\"><span style=\"color:#2d3748\">擦傷/刮傷/勾紗</span><span style=\"color:#c53030;font-weight:600;margin-left:2px\">(13.6%)</span></span><span style=\"display:inline-block;margin-right:10px;white-space:nowrap\"><span style=\"color:#2d3748\">棉粒/結頭/粗節</span><span style=\"color:#c53030;font-weight:600;margin-left:2px\">(13.6%)</span></span><span style=\"display:inline-block;margin-right:10px;white-space:nowrap\"><span style=\"color:#2d3748\">針痕/直條</span><span style=\"color:#c53030;font-weight:600;margin-left:2px\">(9.1%)</span></span><span style=\"display:inline-block;margin-right:10px;white-space:nowrap const BLUE = ['#0f3460','#1e5799','#2980b9','#3498db','#5dade2','#85c1e9','#aed6f1','#cce5f6','#a3bfdb','#7f8c8d','#95a5a6','#bdc3c7'];
const RED  = '#c53030';
let charts = {};
let currentMode = 'fty';

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); charts[id] = null; }
}

function switchMode(mode) {
  currentMode = mode;
  // 切換頂部按鈕樣式
  ['fty','qc'].forEach(m => {
    const btn = document.getElementById('mode-' + m);
    if (m === mode) {
      btn.style.background = '#fff'; btn.style.color = '#0f3460';
      btn.style.border = '2px solid #fff';
    } else {
      btn.style.background = 'transparent'; btn.style.color = '#cbd5e0';
      btn.style.border = '2px solid rgba(255,255,255,.4)';
    }
  });
  // 切換供應地 tab bar
  document.getElementById('tab-bar-fty').style.display = mode === 'fty' ? '' : 'none';
  document.getElementById('tab-bar-qc').style.display  = mode === 'qc'  ? '' : 'none';
  // 切換到該 mode 的預設供應地
  const defaultR = mode === 'fty' ? 'CHN' : 'CHN';
  switchRegion(defaultR);
}

function switchRegion(region) {
  // Tab 狀態（只更新當前 mode 的 tab bar）
  const bar = document.getElementById('tab-bar-' + currentMode);
  bar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = bar.querySelector('[id$="-' + region + '"]');
  if (activeBtn) activeBtn.classList.add('active');
  document.getElementById('hdr-region').textContent = region;

  const d = ALL_DATA[currentMode][region];
  if (!d) return;
  const cur = d.cur; const ytd = d.ytd;

  // KPI 當月
  document.getElementById('kpi-cpct').textContent = cur.c_pct.toFixed(1) + '%';
  document.getElementById('kpi-rcv').innerHTML = (cur.rcv/10000).toFixed(1) + '<span style="font-size:16px;font-weight:400">萬</span>';
  document.getElementById('kpi-count').textContent = cur.count.toLocaleString();
  const failPct = cur.count > 0 ? (cur.fail / cur.count * 100).toFixed(1) : '0.0';
  document.getElementById('kpi-fail').textContent = failPct + '%';
  // KPI 全年
  document.getElementById('kpi-cpct-ytd').textContent = ytd.c_pct.toFixed(1) + '%';
  document.getElementById('kpi-rcv-ytd').innerHTML = (ytd.rcv/10000).toFixed(0) + '<span style="font-size:14px;font-weight:400">萬</span>';
  document.getElementById('kpi-count-ytd').textContent = ytd.count.toLocaleString();
  const ytdFailPct = ytd.count > 0 ? (ytd.fail / ytd.count * 100).toFixed(1) : '0.0';
  document.getElementById('kpi-fail-ytd').textContent = ytdFailPct + '%';
  // KPI sub（當月 / 全年）
  document.getElementById('kpi-cq-sub').textContent = `C級碼數：當月 ${Math.round(cur.cq).toLocaleString()} yds，全年 ${Math.round(ytd.cq).toLocaleString()} yds`;
  document.getElementById('kpi-rcv-sub').textContent = `收料碼數：當月 ${Math.round(cur.rcv).toLocaleString()} yds，全年 ${Math.round(ytd.rcv).toLocaleString()} yds`;
  document.getElementById('kpi-pfd').textContent = `驗布筆數：當月 ${cur.count.toLocaleString()}筆，全年 ${ytd.count.toLocaleString()}筆`;
  document.getElementById('kpi-fail-sub').textContent = `Fail筆數：當月 ${cur.fail}筆，全年 ${ytd.fail}筆`;

  // 趨勢圖
  destroyChart('trendChart');
  charts['trendChart'] = new Chart(document.getElementById('trendChart'), {
    type: 'bar',
    data: {
      labels: d.trend.labels,
      datasets: [
        { type:'bar', label:'收料碼數 (萬yds)', data: d.trend.rcv,
           backgroundColor:'rgba(15,52,96,.15)', borderColor:'#0f3460', borderWidth:1.5, yAxisID:'y' },
        { type:'line', label:'C級%', data: d.trend.cpct,
           borderColor:RED, backgroundColor:'transparent', borderWidth:2.5,
           pointBackgroundColor:RED, pointRadius:5, tension:0.3, yAxisID:'y1' }
      ]
    },
    options: {
      responsive:true, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'top'}, tooltip:{callbacks:{
        label: ctx => ctx.dataset.yAxisID==='y1' ? `C%: ${ctx.raw}%` : `碼數: ${ctx.raw}萬yds`
      }} },
      scales:{
        x:  {ticks:{color:'#2d3748',font:{size:12}},grid:{color:'#e2e8f0'}},
        y:  {type:'linear',position:'left', title:{display:true,text:'萬yds',color:'#2d3748',font:{size:12}},
              grid:{color:'#e2e8f0'},ticks:{color:'#2d3748',font:{size:12}}},
        y1: {type:'linear',position:'right',title:{display:true,text:'C%',color:'#2d3748',font:{size:12}},
              grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%',color:'#2d3748',font:{size:12}}}
      }
    }
  });

  // 分析文字
  const prefix = currentMode === 'qc' ? '出貨' : '到廠';
  document.getElementById('a-insp').textContent = prefix + '收料量較多：' + (d.analysis.top3_insp.join(' 、') || '-');
  document.getElementById('a-cpct').textContent = prefix + ' C 級品較高：' + (d.analysis.top3_cpct.join(' 、') || '-');

  // 供應商收料量
  destroyChart('inspChart');
  charts['inspChart'] = new Chart(document.getElementById('inspChart'), {
    type:'bar',
    data:{ labels: d.top_insp.names,
      datasets:[{label:'收料碼數', data:d.top_insp.vals, backgroundColor:BLUE, borderRadius:4}] },
    options:{ indexAxis:'y', responsive:true,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>ctx.raw.toLocaleString()+' yds'}}},
      scales:{ x:{grid:{color:'#e2e8f0'},ticks:{color:'#2d3748',font:{size:12}}},
                y:{ticks:{font:{size:12},color:'#2d3748'}}  }
    }
  });

  // 供應商C%
  destroyChart('cpctChart');
  charts['cpctChart'] = new Chart(document.getElementById('cpctChart'), {
    type:'bar',
    data:{ labels: d.top_cpct.names,
      datasets:[{label:'C級%', data:d.top_cpct.vals, backgroundColor:d.top_cpct.colors, borderRadius:4}] },
    options:{ indexAxis:'y', responsive:true,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>ctx.raw+'%'}}},
      scales:{ x:{grid:{color:'#e2e8f0'},ticks:{callback:v=>v+'%',color:'#2d3748',font:{size:12}}},
                y:{ticks:{font:{size:12},color:'#2d3748'}}  }
    }
  });

  // 重點供應商
  document.getElementById('key-section').innerHTML = d.key_html;
}

// 初始載入
switchMode('fty');
</script>
