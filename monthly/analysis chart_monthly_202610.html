const BLUE = ['#0f3460','#1e5799','#2980b9','#3498db','#5dade2','#85c1e9','#aed6f1','#cce5f6','#a3bfdb','#7f8c8d','#95a5a6','#bdc3c7'];
const RED  = '#c53030';
let charts = {};

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); charts[id] = null; }
}

function switchRegion(region) {
  // Tab 狀態
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + region).classList.add('active');
  document.getElementById('hdr-region').textContent = region;

  const d = ALL_DATA[region];
  const cur = d.cur; const ytd = d.ytd;

  // KPI
  document.getElementById('kpi-cpct').textContent = cur.c_pct.toFixed(1) + '%';
  document.getElementById('kpi-rcv').innerHTML = (cur.rcv/10000).toFixed(1) + '<span style="font-size:16px;font-weight:400">萬</span>';
  document.getElementById('kpi-rcv-sub').textContent = Math.round(cur.rcv).toLocaleString() + ' yds';
  document.getElementById('kpi-count').textContent = cur.count.toLocaleString();
  const failPct = cur.count > 0 ? (cur.fail / cur.count * 100).toFixed(1) : '0.0';
  document.getElementById('kpi-pfd').innerHTML =
    `<span style="color:#9b2c2c;font-weight:600">Fail ${failPct}%</span> &nbsp;(${cur.fail}筆)`;
  document.getElementById('kpi-ytd').textContent = ytd.c_pct.toFixed(1) + '%';
  document.getElementById('kpi-ytd-sub').textContent = `YTD 2026 | ${(ytd.rcv/10000).toFixed(0)}萬碼`;

  // 趨勢圖
  destroyChart('trendChart');
  charts['trendChart'] = new Chart(document.getElementById('trendChart'), {
    type: 'bar',
    data: {
      labels: d.trend.labels,
      datasets: [
        { type:'bar', label:'收料碼數 (萬yds)', data: d.trend.rcv,
           backgroundColor:'rgba(15,52,96,.15)', borderColor:'#0f3460', borderWidth:1.5, yAxisID:'y' },
        { type:'line', label:'C級%', data: d.trend.cpct,
           borderColor:RED, backgroundColor:'transparent', borderWidth:2.5,
           pointBackgroundColor:RED, pointRadius:5, tension:0.3, yAxisID:'y1' }
      ]
    },
    options: {
      responsive:true, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'top'}, tooltip:{callbacks:{
        label: ctx => ctx.dataset.yAxisID==='y1' ? `C%: ${ctx.raw}%` : `碼數: ${ctx.raw}萬yds`
      }} },
      scales:{
        x:  {ticks:{color:'#2d3748',font:{size:12}},grid:{color:'#e2e8f0'}},
        y:  {type:'linear',position:'left', title:{display:true,text:'萬yds',color:'#2d3748',font:{size:12}},
              grid:{color:'#e2e8f0'},ticks:{color:'#2d3748',font:{size:12}}},
        y1: {type:'linear',position:'right',title:{display:true,text:'C%',color:'#2d3748',font:{size:12}},
              grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%',color:'#2d3748',font:{size:12}}}
      }
    }
  });

  // 分析文字
  document.getElementById('a-insp').textContent = '到廠收料量較多：' + (d.analysis.top3_insp.join(' 、') || '-');
  document.getElementById('a-cpct').textContent = '到廠 C 級品較高：' + (d.analysis.top3_cpct.join(' 、') || '-');

  // 供應商收料量
  destroyChart('inspChart');
  charts['inspChart'] = new Chart(document.getElementById('inspChart'), {
    type:'bar',
    data:{ labels: d.top_insp.names,
      datasets:[{label:'收料碼數', data:d.top_insp.vals, backgroundColor:BLUE, borderRadius:4}] },
    options:{ indexAxis:'y', responsive:true,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>ctx.raw.toLocaleString()+' yds'}}},
      scales:{ x:{grid:{color:'#e2e8f0'},ticks:{color:'#2d3748',font:{size:12}}},
                y:{ticks:{font:{size:12},color:'#2d3748'}}  }
    }
  });

  // 供應商C%
  destroyChart('cpctChart');
  charts['cpctChart'] = new Chart(document.getElementById('cpctChart'), {
    type:'bar',
    data:{ labels: d.top_cpct.names,
      datasets:[{label:'C級%', data:d.top_cpct.vals, backgroundColor:d.top_cpct.colors, borderRadius:4}] },
    options:{ indexAxis:'y', responsive:true,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>ctx.raw+'%'}}},
      scales:{ x:{grid:{color:'#e2e8f0'},ticks:{callback:v=>v+'%',color:'#2d3748',font:{size:12}}},
                y:{ticks:{font:{size:12},color:'#2d3748'}}  }
    }
  });

  // 重點供應商
  document.getElementById('key-section').innerHTML = d.key_html;
}

// 初始載入
switchRegion('CHN');
