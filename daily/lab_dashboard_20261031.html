<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .screen { display: none !important; }
        .screen.active { display: block !important; }

        .upload-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .upload-card {
            background: white;
            border-radius: 12px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }
        .upload-icon { font-size: 64px; margin-bottom: 20px; }
        .upload-title { font-size: 28px; font-weight: 700; color: #2c3e50; margin-bottom: 12px; }
        .upload-description { font-size: 14px; color: #999; margin-bottom: 40px; }

        .file-input-label {
            display: block;
            padding: 40px 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: #f8f9ff;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .file-input-label input { display: none; }
        .file-input-text { font-size: 14px; color: #667eea; font-weight: 600; }
        .file-name { font-size: 12px; color: #27ae60; margin-top: 8px; }

        .btn-upload {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-upload:disabled { opacity: 0.6; }

        .dashboard-screen { display: flex; flex-direction: column; gap: 30px; }
        .dashboard-header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .date-nav { display: flex; align-items: center; gap: 15px; }
        .nav-btn { background: none; border: none; font-size: 32px; cursor: pointer; color: #667eea; font-weight: 900; text-shadow: 0 0 1px rgba(0,0,0,0.3); }
        .date-display { font-weight: 600; color: #2c3e50; min-width: 100px; text-align: center; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .location-filter { display: flex; align-items: center; gap: 12px; }
        .btn-data-type {
            padding: 8px 14px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-data-type:hover { background: #e8e8e8; }
        .btn-data-type.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        .location-select { padding: 8px 12px; border: 2px solid #ddd; border-radius: 4px; min-width: 150px; }
        .btn-back { padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }

        .main-content { display: flex; gap: 20px; }
        .sidebar { display: none; }
        .sidebar-label { display: none; }
        .sidebar-location { font-size: 15px; font-weight: 700; color: #555; }

        .cards-wrapper { flex: 1; }
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .qc-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }
        .cards-container > .qc-card:nth-child(4n+1) { border-left-color: #16a34a; }
        .cards-container > .qc-card:nth-child(4n+2) { border-left-color: #0891b2; }
        .cards-container > .qc-card:nth-child(4n+3) { border-left-color: #991b1b; }
        .cards-container > .qc-card:nth-child(4n) { border-left-color: #f59e0b; }

        .card-header { margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .card-title { font-size: 16px; font-weight: 700; color: #2c3e50; }
        .card-subtitle { font-size: 12px; color: #999; margin-top: 4px; }
        .card-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px; }
        .cards-container { grid-template-columns: repeat(4, 1fr) !important; }
        .metric { padding: 8px 0; }
        .metric-label { font-size: 11px; color: #555; font-weight: 600; margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: 700; color: #2563eb; }
        .card-metrics > .metric:nth-child(2) .metric-value { color: #dc2626; }
        .card-details { padding: 12px; background: #fffbeb; border-radius: 4px; font-size: 12px; }
        .card-details-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #555; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #999; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); }
        .modal.show { display: block; }
        .modal-content { background-color: white; margin: 20px auto; padding: 20px; border-radius: 8px; max-width: 1200px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .modal-title { font-size: 18px; font-weight: 700; color: #2c3e50; }
        .modal-close { background: none; border: none; font-size: 28px; color: #999; cursor: pointer; }
        .modal-close:hover { color: #333; }

        .details-table-wrapper { overflow-x: auto; max-height: 70vh; }
        .details-table { width: 100%; min-width: 2000px; border-collapse: collapse; font-size: 12px; }
        .details-table th {
            background: #f5f5f5;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
            min-width: 80px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .details-table td { padding: 10px 12px; border-bottom: 1px solid #eee; white-space: nowrap; }
        .details-table tr:hover { background: #fafafa; }

        .detail-link { color: #667eea; cursor: pointer; text-decoration: underline; font-weight: 600; }
        .detail-link:hover { color: #764ba2; }
        .style-no-link { color: #667eea; cursor: pointer; text-decoration: underline; font-weight: 600; }
        .style-no-link:hover { color: #764ba2; }

        .details-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .details-modal.show {
            display: flex;
        }
        .details-modal-content {
            background: white;
            width: 95%;
            height: 90%;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }
        .details-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .details-modal-header h2 {
            font-size: 18px;
            color: #2c3e50;
        }
        .details-modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        .details-modal-close:hover {
            color: #333;
        }
        .details-modal-body {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .details-modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="dashboardScreen" class="screen dashboard-screen active">
            <div class="dashboard-header">
                <div class="header-top">
                    <div class="date-nav">
                        <button class="nav-btn" id="prevBtn">←</button>
                        <div class="date-display" id="dateDisplay">—</div>
                        <button class="nav-btn" id="nextBtn">→</button>
                    </div>
                    <div class="header-right">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <div style="display: flex; gap: 6px;">
                                <button class="btn-data-type active" id="btnQc" data-type="qc">品管（前端）</button>
                                <button class="btn-data-type" id="btnFactory" data-type="factory">工廠（後端）</button>
                            </div>
                            <div class="location-filter">
                                <label>成衣產區</label>
                                <select class="location-select" id="locationSelect">
                                    <option value="">全部</option>

                </div>
                <div style="font-size: 12px; color: #666; margin-top: 6px;">

            </div>

            <div class="main-content">
                <div class="sidebar">
                    <div class="sidebar-label">成衣產區</div>
                    <div class="sidebar-location" id="sidebarLocation">—</div>
                </div>

                <div class="cards-wrapper">
                    <div id="cardsContainer" class="cards-container"></div>
                </div>
            </div>
        </div>

        <div id="detailsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title" id="modalTitle">明細詳情</div>
                    <button class="modal-close" id="modalClose">&times;</button>
                </div>
                <div class="details-table-wrapper">
                    <table class="details-table" id="detailsTable">
                        <thead>
                            <tr>
                                <th>測試日期</th>
                                <th>客戶</th>
                                <th>OE款號</th>
                                <th>供應商</th>
                                <th>成衣產區</th>
                                <th>供應地</th>
                                <th>PO單號</th>
                                <th>批號</th>
                                <th>匹號</th>
                                <th>布種</th>
                                <th>顏色</th>
                                <th>測試項目</th>
                                <th>數值</th>
                                <th>標準</th>
                                <th>判定</th>
                            </tr>
                        </thead>
                        <tbody id="detailsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

        }

        function initDates() {
            dates = [...new Set(rowsOfType().map(r => r.d))].sort();
            dateIdx = dates.length - 1;
        }

        function updateDateDisplay() {
            const d = dates[dateIdx];
            if (!d) {
                document.getElementById('dateDisplay').textContent = '無資料';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }
            const wd = WEEKDAYS[new Date(d.replace(/\//g, '-')).getDay()];
            document.getElementById('dateDisplay').textContent = `${d} (週${wd})`;
            document.getElementById('prevBtn').disabled = dateIdx <= 0;
            document.getElementById('nextBtn').disabled = dateIdx >= dates.length - 1;
        }

        function updateLocationFilter() {
            const locs = [...new Set(rowsOfType().map(r => r.l).filter(Boolean))].sort();
            const sel = document.getElementById('locationSelect');
            sel.innerHTML = '<option value="">全部</option>' + locs.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
            selectedLocation = '';
            sel.value = '';
        }

        function updateDashboard() {
            const d = dates[dateIdx];
            const groups = new Map();
            rowsOfType().forEach(r => {
                if (r.d !== d) return;
                if (selectedLocation && r.l !== selectedLocation) return;
                if (!groups.has(r.s)) groups.set(r.s, []);
                groups.get(r.s).push(r);
            });

            const cards = [...groups.entries()].map(([supp, rows]) => {
                const byCust = new Map();
                rows.forEach(r => {
                    if (!byCust.has(r.c)) byCust.set(r.c, { total: 0, fail: 0 });
                    const e = byCust.get(r.c);
                    e.total++;
                    if (!r.p) e.fail++;
                });
                const total = rows.length;
                const fail = rows.filter(r => !r.p).length;
                return {
                    supp,
                    total,
                    pass: total - fail,
                    fail,
                    rate: total > 0 ? fail / total : 0,
                    loc: rows[0].l,
                    customers: [...byCust.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([c, e]) => ({ c, total: e.total, fail: e.fail }))
                };
            }).sort((a, b) => a.supp.localeCompare(b.supp, 'zh-Hant'));

            const html = cards.length === 0
                ? '<div class="empty-state">📭 無數據</div>'
                : cards.map(c => `
                    <div class="qc-card">
                        <div class="card-header">
                            <div class="card-title">${esc(c.supp)}</div>
                            <div style="font-size: 12px; margin-top: 4px; ${c.fail > 0 ? 'color: #dc2626; font-weight: bold;' : 'color: #333;'}">
                                <span>Pass(${c.pass})</span>
                                <span style="margin: 0 6px;"></span>
                                <span>Fail(${c.fail})</span>
                            </div>
                        </div>
                        <div class="card-metrics">
                            <div class="metric">
                                <div class="metric-label">測試筆數</div>
                                <div class="metric-value">${c.total.toLocaleString()}</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">不通過數</div>
                                <div class="metric-value">${c.fail.toLocaleString()}</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">不通過率</div>
                                <div class="metric-value">${(c.rate * 100).toFixed(1)}%</div>
                            </div>
                        </div>
                        <div class="card-details">
                            ${c.customers.map(cu => `
                                <div class="card-details-row" style="color: ${cu.fail > 0 ? '#dc2626' : '#16a34a'}; ${cu.fail > 0 ? 'font-weight: bold;' : ''}">
                                    <span class="detail-link" onclick="showDetails('${esc(cu.c).replace(/'/g, "\\'")}', '${esc(c.supp).replace(/'/g, "\\'")}')">${cu.fail > 0 ? '*' : ''}${esc(cu.c)}（${cu.fail}/${cu.total}，${cu.total > 0 ? (cu.fail/cu.total*100).toFixed(1) : '0.0'}%）</span>
                                </div>`).join('')}
                        </div>
                    </div>`).join('');

            document.getElementById('cardsContainer').innerHTML = html;
            document.getElementById('sidebarLocation').textContent = selectedLocation || '多地';
        }

        function showDetails(cust, supp) {
            const d = dates[dateIdx];
            const rows = rowsOfType().filter(r =>
                r.d === d && r.c === cust && r.s === supp && (!selectedLocation || r.l === selectedLocation)
            );
            // PO Fail次數統計
            const poFailCount = {};
            rows.forEach(r => { if (!r.p) poFailCount[r.po] = (poFailCount[r.po] || 0) + 1; });
            rows.sort((a, b) => {
                const fa = poFailCount[a.po] || 0, fb = poFailCount[b.po] || 0;
                if (fb !== fa) return fb - fa;
                return a.po.localeCompare(b.po, undefined, { numeric: true }) || a.col.localeCompare(b.col, undefined, { numeric: true }) || a.lot.localeCompare(b.lot, undefined, { numeric: true }) || a.rl.localeCompare(b.rl, undefined, { numeric: true });
            });

            document.getElementById('modalTitle').textContent = `${cust} / ${supp}　${d}　共 ${rows.length} 筆`;
            document.getElementById('detailsTableBody').innerHTML = rows.map(r => {
                const std = r.mn || r.mx ? `${r.mn || '-'} ~ ${r.mx || '-'}` : '-';
                const color = r.p ? '#16a34a' : '#dc2626';
                return `<tr>
                    <td>${esc(r.d)}</td>
                    <td>${esc(r.c)}</td>
                    <td style="${r.p ? '' : 'color:#dc2626;font-weight:600;'}">${esc(r.o)}</td>
                    <td>${esc(r.s)}</td>
                    <td>${esc(r.l)}</td>
                    <td>${esc(r.ea || '-')}</td>
                    <td>${esc(r.po)}</td>
                    <td>${esc(r.lot)}</td>
                    <td>${esc(r.rl)}</td>
                    <td>${esc(r.fc)}</td>
                    <td>${esc(r.col)}</td>
                    <td>${esc(r.tt)}</td>
                    <td>${esc(r.v)}</td>
                    <td>${esc(std)}</td>
                    <td style="color: ${r.p ? '#333' : '#dc2626'}; font-weight: 600;">${r.p ? 'Pass' : 'Fail'}</td>
                </tr>`;
            }).join('');
            document.getElementById('detailsModal').classList.add('show');
        }

        function closeDetails() {
            document.getElementById('detailsModal').classList.remove('show');
        }

        function setType(type) {
            selectedType = type;
            document.getElementById('btnQc').classList.toggle('active', type === 'qc');
            document.getElementById('btnFactory').classList.toggle('active', type === 'factory');
            initDates();
            updateLocationFilter();
            updateDateDisplay();
            updateDashboard();
        }

        document.getElementById('btnQc').addEventListener('click', () => setType('qc'));
        document.getElementById('btnFactory').addEventListener('click', () => setType('factory'));
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (dateIdx > 0) { dateIdx--; updateDateDisplay(); updateDashboard(); }
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (dateIdx < dates.length - 1) { dateIdx++; updateDateDisplay(); updateDashboard(); }
        });
        document.getElementById('locationSelect').addEventListener('change', e => {
            selectedLocation = e.target.value;
            updateDashboard();
        });
        document.getElementById('modalClose').addEventListener('click', closeDetails);
        document.getElementById('detailsModal').addEventListener('click', e => {
            if (e.target.id === 'detailsModal') closeDetails();
        });

        document.getElementById('periodInfo').textContent = AUTO_PERIOD;
        setType('qc');
    </script>
</body>
</html>
