<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Dashboard</title>
    <script>

        

        const _d = new Date();
        const _mm = String(_d.getMonth()+1).padStart(2,'0');
        const _dd = String(_d.getDate()).padStart(2,'0');
        document.title = `Lab Dashboard ${_d.getFullYear()}-${_mm}-${_dd}`;

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .screen { display: none !important; }
        .screen.active { display: block !important; }

        .upload-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .upload-card {
            background: white;
            border-radius: 12px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }
        .upload-icon { font-size: 64px; margin-bottom: 20px; }
        .upload-title { font-size: 28px; font-weight: 700; color: #2c3e50; margin-bottom: 12px; }
        .upload-description { font-size: 14px; color: #999; margin-bottom: 40px; }

        .file-input-label {
            display: block;
            padding: 40px 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: #f8f9ff;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .file-input-label input { display: none; }
        .file-input-text { font-size: 14px; color: #667eea; font-weight: 600; }
        .file-name { font-size: 12px; color: #27ae60; margin-top: 8px; }

        .btn-upload {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-upload:disabled { opacity: 0.6; }

        .dashboard-screen { display: flex; flex-direction: column; gap: 30px; }
        .dashboard-header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .date-nav { display: flex; align-items: center; gap: 15px; }
        .nav-btn { background: none; border: none; font-size: 32px; cursor: pointer; color: #667eea; font-weight: 900; text-shadow: 0 0 1px rgba(0,0,0,0.3); }
        .date-display { font-weight: 600; color: #2c3e50; min-width: 100px; text-align: center; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .location-filter { display: flex; align-items: center; gap: 12px; }
        .btn-data-type {
            padding: 8px 14px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-data-type:hover { background: #e8e8e8; }
        .btn-data-type.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        .location-select { padding: 8px 12px; border: 2px solid #ddd; border-radius: 4px; min-width: 150px; }
        .btn-back { padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }

        .main-content { display: flex; gap: 20px; }
        .sidebar { display: none; }
        .sidebar-label { display: none; }
        .sidebar-location { font-size: 15px; font-weight: 700; color: #555; }

        .cards-wrapper { flex: 1; }
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .qc-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }
        .cards-container > .qc-card:nth-child(4n+1) { border-left-color: #16a34a; }
        .cards-container > .qc-card:nth-child(4n+2) { border-left-color: #0891b2; }
        .cards-container > .qc-card:nth-child(4n+3) { border-left-color: #991b1b; }
        .cards-container > .qc-card:nth-child(4n) { border-left-color: #f59e0b; }

        .card-header { margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .card-title { font-size: 16px; font-weight: 700; color: #2c3e50; }
        .card-subtitle { font-size: 12px; color: #999; margin-top: 4px; }
        .card-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px; }
        .cards-container { grid-template-columns: repeat(4, 1fr) !important; }
        .metric { padding: 8px 0; }
        .metric-label { font-size: 11px; color: #555; font-weight: 600; margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: 700; color: #2563eb; }
        .card-metrics > .metric:nth-child(2) .metric-value { color: #dc2626; }
        .card-details { padding: 12px; background: #fffbeb; border-radius: 4px; font-size: 12px; }
        .card-details-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #555; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #999; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); }
        .modal.show { display: block; }
        .modal-content { background-color: white; margin: 20px auto; padding: 20px; border-radius: 8px; max-width: 1200px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .modal-title { font-size: 18px; font-weight: 700; color: #2c3e50; }
        .modal-close { background: none; border: none; font-size: 28px; color: #999; cursor: pointer; }
        .modal-close:hover { color: #333; }

        .details-table-wrapper { overflow-x: auto; max-height: 70vh; }
        .details-table { width: 100%; min-width: 2000px; border-collapse: collapse; font-size: 12px; }
        .details-table th {
            background: #f5f5f5;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
            min-width: 80px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .details-table td { padding: 10px 12px; border-bottom: 1px solid #eee; white-space: nowrap; }
        .details-table tr:hover { background: #fafafa; }

        .detail-link { color: #667eea; cursor: pointer; text-decoration: underline; font-weight: 600; }
        .detail-link:hover { color: #764ba2; }
        .style-no-link { color: #667eea; cursor: pointer; text-decoration: underline; font-weight: 600; }
        .style-no-link:hover { color: #764ba2; }

        .details-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .details-modal.show {
            display: flex;
        }
        .details-modal-content {
            background: white;
            width: 95%;
            height: 90%;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }
        .details-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .details-modal-header h2 {
            font-size: 18px;
            color: #2c3e50;
        }
        .details-modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        .details-modal-close:hover {
            color: #333;
        }
        .details-modal-body {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .defect-modal-body { overflow: auto; padding: 20px 24px; }
        .defect-summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .defect-summary div { background: #f5f7fb; border-radius: 8px; padding: 10px 16px; min-width: 120px; }
        .defect-summary b { display: block; font-size: 12px; color: #667; font-weight: 500; }
        .defect-summary span { font-size: 18px; font-weight: 700; color: #2c3e50; }
        .defect-section { margin-bottom: 22px; }
        .chart-card { background: #f5f7fb; border: 1px solid #d5dbe7; border-radius: 10px; padding: 14px 16px; text-align: left; }
        .defect-section h3 { text-align: left; }
        .defect-section h3 { font-size: 14px; color: #2c3e50; margin: 0 0 8px; }
        .defect-row { display: grid; grid-template-columns: 70px 1fr 110px; gap: 10px; align-items: center; margin-bottom: 6px; font-size: 13px; }
        .defect-bar-bg { background: #eef1f6; border-radius: 4px; height: 18px; overflow: hidden; }
        .defect-bar { background: #667eea; height: 100%; border-radius: 4px; }
        .defect-bar.fail { background: #dc2626; }
        .defect-tokens { font-size: 12px; color: #667; margin: 2px 0 8px 80px; }
        .defect-empty { color: #888; font-size: 13px; }
        .roll-frame { width: 100%; height: 520px; border: 1px solid #e5e7eb; border-radius: 8px; }
    </style>
</head>

    <div class="container">
        <div id="dashboardScreen" class="screen dashboard-screen active">
            <div class="dashboard-header">
                <div class="header-top">
                    <div class="date-nav">
                        <button class="nav-btn" id="prevBtn">←</button>
                        <div class="date-display" id="dateDisplay">—</div>
                        <button class="nav-btn" id="nextBtn">→</button>
                    </div>
                    <div class="header-right">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <div style="display: flex; gap: 6px;">
                                <button class="btn-data-type active" id="btnQc" data-type="qc">品管（前端）</button>
                                <button class="btn-data-type" id="btnFactory" data-type="factory">工廠（後端）</button>
                            </div>
                            <div class="location-filter">
                                <label>成衣產區</label>
                                <select class="location-select" id="locationSelect">
                                    <option value="">全部</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div style="font-size: 12px; color: #666; margin-top: 6px;">
                    Lab Dashboard｜資料來源：Fabric360 API（品管＝hq-tests，工廠＝fty-tests）｜期間 <span id="periodInfo"></span>｜判定依據 IS_PASS
                </div>
            </div>

            <div class="main-content">
                <div class="sidebar">
                    <div class="sidebar-label">成衣產區</div>
                    <div class="sidebar-location" id="sidebarLocation">—</div>
                </div>

                <div class="cards-wrapper">
                    <div id="cardsContainer" class="cards-container"></div>
                </div>
            </div>
        </div>

        <div id="detailsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title" id="modalTitle">明細詳情</div>
                    <button class="modal-close" id="modalClose">&times;</button>
                </div>
                <div id="detailCharts"></div>
                <div class="details-table-wrapper">
                    <table class="details-table" id="detailsTable">
                        <thead>
                            <tr>
                                <th>測試日期</th>
                                <th>客戶</th>
                                <th>OE款號</th>
                                <th>供應商</th>
                                <th>成衣產區</th>
                                <th>供應地</th>
                                <th>PO單號</th>
                                <th>布種</th>
                                <th>顏色</th>
                                <th>判定</th>
                            </tr>
                        </thead>
                        <tbody id="detailsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

                const colorUnits = new Map();
                rows.forEach(r => {
                    const k = `${r.c}|${r.o}|${r.fc}|${r.col}`;
                    if (!colorUnits.has(k)) colorUnits.set(k, { c: r.c, fail: false });
                    if (!r.p) colorUnits.get(k).fail = true;
                });
                colorUnits.forEach(u => {
                    if (!byCust.has(u.c)) byCust.set(u.c, { total: 0, fail: 0 });
                    const e = byCust.get(u.c);
                    e.total++;
                    if (u.fail) e.fail++;
                });
                // 卡片統計以「顏色」計：客戶 + OE款號 + 布種 + 顏色 為一單位，任一筆 Fail 即該單位 Fail

                    if (!r.p) colorMap.set(k, true);

                const k = `${r.lot}|${r.rl}`;
                const st = rolls[k] || (rolls[k] = { lot: r.lot, rl: r.rl, p: 0, f: 0, res: {} });
                if (r.p) st.p++; else st.f++;
                st.res[r.tt] = (st.res[r.tt] === undefined ? true : st.res[r.tt]) && r.p;
            });
            const rollArr = Object.values(rolls).sort((a, b) => a.lot.localeCompare(b.lot, undefined, { numeric: true })
                || a.rl.localeCompare(b.rl, undefined, { numeric: true }));
            // 各缸：Pass / Fail 匹數疊加條（一匹中任一項目 Fail 即該匹 Fail）與 Fail%
            const lots = {};
            rollArr.forEach(x => {
                const lt = lab(x.lot);
                const st = lots[lt] || (lots[lt] = { p: 0, f: 0 });
                if (x.f > 0) st.f++; else st.p++;
            });
            const lotNames = Object.keys(lots).sort((a, b) => (lots[b].f / (lots[b].p + lots[b].f)) - (lots[a].f / (lots[a].p + lots[a].f)) || lots[b].f - lots[a].f || a.localeCompare(b, undefined, { numeric: true }));
            const maxL = Math.max(1, ...lotNames.map(n => lots[n].p + lots[n].f));
            const bwL = 90, rhL = 30, topL = 30;
            const lgL = Math.max(...lotNames.map(n => n.length)) * 7.2 + 10;
            const W1 = lgL + bwL + 150, H1 = topL + lotNames.length * rhL + 4;
            const bars1 = lotNames.map((n, i) => {
                const it = lots[n], y = topL + i * rhL, tot = it.p + it.f;
                const wp = it.p / maxL * bwL, wf = it.f / maxL * bwL;
                const pct = (it.f / tot * 100).toFixed(1);
                return `<text x="0" y="${y + 15}" font-size="12" fill="#2c3e50">${esc(n)}</text>`
                    + `<rect x="${lgL}" y="${y}" width="${wp}" height="20" fill="#16a34a"/>`
                    + `<rect x="${lgL + wp}" y="${y}" width="${wf}" height="20" fill="#dc2626"/>`
                    + `<text x="${lgL + wp + wf + 8}" y="${y + 15}" font-size="12" ${it.f ? 'font-weight="700" fill="#dc2626"' : 'fill="#667"'}>Fail ${pct}%（F ${it.f}，P ${it.p}）</text>`;
            }).join('');
            const svg1 = `<svg width="${W1}" height="${H1}" viewBox="0 0 ${W1} ${H1}"><rect x="0" y="4" width="12" height="12" fill="#16a34a"/><text x="18" y="15" font-size="12" fill="#2c3e50">Pass 匹數</text><rect x="96" y="4" width="12" height="12" fill="#dc2626"/><text x="114" y="15" font-size="12" fill="#2c3e50">Fail 匹數</text>${bars1}</svg>`;

            // 整體：Pass 在左圓、Fail 在右圓；每個點代表一個測試項目（不分缸、不分匹），點平均分布在圓內
            const nP = rows.filter(r => r.p).length, nF = rows.length - nP;
            const circD = 150, hdr = 26, pad = 8, gapB = 14;
            const R = circD / 2, Rin = R - pad;
            // 向日葵排列：各點對圓面積均勻分布
            const GA = Math.PI * (3 - Math.sqrt(5));
            const spacingOf = n => n <= 0 ? 99 : Rin * Math.sqrt(Math.PI / n);
            const dotR = Math.max(1.2, Math.min(8, Math.min(spacingOf(nP), spacingOf(nF)) * 0.4));
            const dotsOf = (n, cx0, color) => {
                let d = '';
                for (let k = 0; k < n; k++) {
                    const rr = Rin * Math.sqrt((k + 0.5) / n), a = k * GA;
                    d += `<circle cx="${(cx0 + rr * Math.cos(a)).toFixed(1)}" cy="${(hdr + R + rr * Math.sin(a)).toFixed(1)}" r="${dotR.toFixed(1)}" fill="${color}"/>`;
                }
                return d;
            };
            const cxP = R + 0.5, cxF = circD + gapB + R + 0.5;
            const W3 = circD * 2 + gapB + 1, H3 = hdr + circD + 4;
            const svg3 = `<svg width="${W3}" height="${H3}" viewBox="0 0 ${W3} ${H3}">`
                + `<text x="0" y="16" font-size="12" font-weight="700" fill="#16a34a">Pass（${nP}）</text>`
                + `<text x="${circD + gapB}" y="16" font-size="12" font-weight="700" fill="#dc2626">Fail（${nF}）</text>`
                + `<circle cx="${cxP}" cy="${hdr + R}" r="${R}" fill="#fff" stroke="#bfe3cb" stroke-width="1.5"/>`
                + `<circle cx="${cxF}" cy="${hdr + R}" r="${R}" fill="#fff" stroke="#f0c0c0" stroke-width="1.5"/>`
                + dotsOf(nP, cxP, '#16a34a') + dotsOf(nF, cxF, '#dc2626') + `</svg>`;

            const items = {};
            rows.forEach(r => {
                const b = baseOf(r.tt);
                const st = items[b] || (items[b] = { p: 0, f: 0 });
                if (r.p) st.p++; else st.f++;
            });
            const names = Object.keys(items).sort((a, b) => (items[b].f / (items[b].p + items[b].f)) - (items[a].f / (items[a].p + items[a].f)) || items[b].f - items[a].f || a.localeCompare(b));
            const maxT = Math.max(1, ...names.map(n => items[n].p + items[n].f));
            const bw = 140, rh2 = 30;
            const lg = Math.max(...names.map(n => n.length)) * 7.2 + 10;
            const W2 = lg + bw + 95, H2 = names.length * rh2 + 8;
            const bars2 = names.map((n, i) => {
                const it = items[n], y = 6 + i * rh2, tot = it.p + it.f;
                const wp = it.p / maxT * bw, wf = it.f / maxT * bw;
                const pct = (it.f / tot * 100).toFixed(1);
                return `<text x="0" y="${y + 15}" font-size="12" fill="#2c3e50">${esc(n)}</text>`
                    + `<rect x="${lg}" y="${y}" width="${wp}" height="20" fill="#16a34a"/>`
                    + `<rect x="${lg + wp}" y="${y}" width="${wf}" height="20" fill="#dc2626"/>`
                    + `<text x="${lg + wp + wf + 8}" y="${y + 15}" font-size="12" ${it.f ? 'font-weight="700" fill="#dc2626"' : 'fill="#667"'}>Fail ${pct}%</text>`;
            }).join('');
            const svg2 = `<svg width="${W2}" height="${H2}" viewBox="0 0 ${W2} ${H2}">${bars2}</svg>`;
            return `<div class="dchart"><h4>(1) 各缸 Pass / Fail 與 Fail%</h4><div>${svg1}</div></div>`
                + `<div class="dchart"><h4>(2) 各項目 Pass / Fail 與 Fail%</h4>${svg2}</div>`
                + `<div class="dchart"><h4>(3) 整體 Pass / Fail 分布</h4><div>${svg3}</div></div>`
                + `<h4 class="dtitle" style="flex-basis:100%">(4) 各匹明細</h4>`;
        }

        // 第二層：同一匹(Lot+Roll)一列，項目依序往右；Dry/Wet、Length/Width 同一欄、上下分行
        function showColorDetail(gi) {
            const g = detailGroups[gi];
            const keyOf = r => `${r.o}|${r.fc}|${r.col}`;
            const rows = detailCtx.rows.filter(r => keyOf(r) === g.key);
            const col = g.ref.col;
            const groups = {};
            rows.filter(r => r.col === col).forEach(r => {
                const m = r.tt.match(/^(.*)(Dry|Wet|Length|Width)$/);
                const base = m ? m[1] : r.tt;
                const k = `${r.lot}|${r.rl}|${base}`;
                const g = groups[k] || (groups[k] = { lot: r.lot, rl: r.rl, base, items: {} });
                g.items[r.tt] = r;
            });
            const bases = [...new Set(Object.values(groups).map(g => g.base))].sort();
            const rolls = {};
            Object.values(groups).forEach(g => {
                const rk = `${g.lot}|${g.rl}`;
                const roll = rolls[rk] || (rolls[rk] = { lot: g.lot, rl: g.rl, cells: {} });
                roll.cells[g.base] = g;
            });
            const rollList = Object.values(rolls).sort((a, b) => a.lot.localeCompare(b.lot, undefined, { numeric: true })
                || a.rl.localeCompare(b.rl, undefined, { numeric: true }));
            const rollFail = new Set(rows.filter(r => r.col === col && !r.p).map(r => `${r.lot}|${r.rl}`));
            const table = document.getElementById('detailsTable');
            table.style.width = 'auto';
            table.style.minWidth = 'auto';
            table.classList.add('detail-roll');
            document.querySelector('#detailsTable thead').innerHTML = `<tr><th>Lot</th><th>Roll</th><th>判定</th>${bases.map(b => `<th>${esc(b)}</th>`).join('')}</tr>`;
            detailLayer = 2;
            document.getElementById('detailCharts').innerHTML = renderDetailCharts(rows);
            const f = rows.find(r => r.col === col);
            document.getElementById('modalTitle').innerHTML = `${esc(f.o)}<span style="font-weight:400"> - ${esc(f.c)}_${esc(f.s)}_${esc(f.fc)}_${esc(f.col)}</span>`;
            document.getElementById('detailsTableBody').innerHTML = rollList.map(roll => {
                const failed = rollFail.has(`${roll.lot}|${roll.rl}`);
                const cells = bases.map(b => {
                    const g = roll.cells[b];
                    if (!g) return '<td></td>';
                    return `<td>${Object.keys(g.items).sort().map(tt => {
                        const r = g.items[tt];
                        const std = r.mn || r.mx ? `${r.mn || '-'} ~ ${r.mx || '-'}` : '-';
                        return `<div>${esc(tt.slice(g.base.length).replace('Length', 'Len').replace('Width', 'Wid'))}<span style="color:${r.p ? '#16a34a' : '#dc2626'};font-weight:600;margin-left:8px;">${r.p ? 'P' : 'F'}</span><span style="margin-left:8px;${r.p ? '' : 'color:#dc2626;'}">${esc(r.v)}</span><span style="margin-left:8px;">(${esc(std)})</span></div>`;
                    }).join('')}</td>`;
                }).join('');
                return `<tr>
                    <td>${roll.lot === '成衣修色' ? '-' : esc(roll.lot)}</td>
                    <td>${roll.rl === '成衣修色' ? '-' : esc(roll.rl)}</td>
                    <td style="color:${failed ? '#dc2626' : '#16a34a'};font-weight:600;">${failed ? 'Fail' : 'Pass'}</td>
                    ${cells}
                </tr>`;
            }).join('');
        }

        function closeDetails() {
            document.getElementById('detailsModal').classList.remove('show');
        }

        function setType(type) {
            selectedType = type;
            document.getElementById('btnQc').classList.toggle('active', type === 'qc');
            document.getElementById('btnFactory').classList.toggle('active', type === 'factory');
            initDates();
            updateLocationFilter();
            updateDateDisplay();
            updateDashboard();
        }

        document.getElementById('btnQc').addEventListener('click', () => setType('qc'));
        document.getElementById('btnFactory').addEventListener('click', () => setType('factory'));
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (dateIdx > 0) { dateIdx--; updateDateDisplay(); updateDashboard(); }
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (dateIdx < dates.length - 1) { dateIdx++; updateDateDisplay(); updateDashboard(); }
        });
        document.getElementById('locationSelect').addEventListener('change', e => {
            selectedLocation = e.target.value;
            updateDashboard();
        });
        document.getElementById('modalClose').addEventListener('click', () => {
            if (detailLayer === 2) showDetails(detailCtx.cust, detailCtx.supp);
            else closeDetails();
        });
        document.getElementById('detailsModal').addEventListener('click', e => {
            if (e.target.id !== 'detailsModal') return;
            if (detailLayer === 2) showDetails(detailCtx.cust, detailCtx.supp);
            else closeDetails();
        });

        document.getElementById('periodInfo').textContent = AUTO_PERIOD;
        setType('qc');
    </script>
</body>
</html>
