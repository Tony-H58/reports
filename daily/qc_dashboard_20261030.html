<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .screen { display: none !important; }
        .screen.active { display: block !important; }

        .upload-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .upload-card {
            background: white;
            border-radius: 12px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }
        .upload-icon { font-size: 64px; margin-bottom: 20px; }
        .upload-title { font-size: 28px; font-weight: 700; color: #2c3e50; margin-bottom: 12px; }
        .upload-description { font-size: 14px; color: #999; margin-bottom: 40px; }

        .file-input-label {
            display: block;
            padding: 40px 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: #f8f9ff;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .file-input-label input { display: none; }
        .file-input-text { font-size: 14px; color: #667eea; font-weight: 600; }
        .file-name { font-size: 12px; color: #27ae60; margin-top: 8px; }

        .btn-upload {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-upload:disabled { opacity: 0.6; }

        .dashboard-screen { display: flex; flex-direction: column; gap: 30px; }
        .dashboard-header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .date-nav { display: flex; align-items: center; gap: 15px; }
        .nav-btn { background: none; border: none; font-size: 32px; cursor: pointer; color: #667eea; font-weight: 900; text-shadow: 0 0 1px rgba(0,0,0,0.3); }
        .date-display { font-weight: 600; color: #2c3e50; min-width: 100px; text-align: center; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .location-filter { display: flex; align-items: center; gap: 12px; }
        .btn-data-type {
            padding: 8px 14px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-data-type:hover { background: #e8e8e8; }
        .btn-data-type.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        .location-select { padding: 8px 12px; border: 2px solid #ddd; border-radius: 4px; min-width: 150px; }
        .btn-back { padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }

        .main-content { display: flex; gap: 20px; }
        .sidebar { display: none; }
        .sidebar-label { display: none; }
        .sidebar-location { font-size: 15px; font-weight: 700; color: #555; }

        .cards-wrapper { flex: 1; }
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .qc-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }
        .cards-container > .qc-card:nth-child(4n+1) { border-left-color: #16a34a; }
        .cards-container > .qc-card:nth-child(4n+2) { border-left-color: #0891b2; }
        .cards-container > .qc-card:nth-child(4n+3) { border-left-color: #991b1b; }
        .cards-container > .qc-card:nth-child(4n) { border-left-color: #f59e0b; }

        .card-header { margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .card-title { font-size: 16px; font-weight: 700; color: #2c3e50; }
        .card-subtitle { font-size: 12px; color: #999; margin-top: 4px; }
        .card-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px; }
        .cards-container { grid-template-columns: repeat(4, 1fr) !important; }
        .metric { padding: 8px 0; }
        .metric-label { font-size: 11px; color: #555; font-weight: 600; margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: 700; color: #2563eb; }
        .card-metrics > .metric:nth-child(2) .metric-value { color: #dc2626; }
        .card-details { padding: 12px; background: #fffbeb; border-radius: 4px; font-size: 12px; }
        .card-details-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #555; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #999; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); }
        .modal.show { display: block; }
        .modal-content { background-color: white; margin: 20px auto; padding: 20px; border-radius: 8px; max-width: 1200px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .modal-title { font-size: 18px; font-weight: 700; color: #2c3e50; }
        .modal-close { background: none; border: none; font-size: 28px; color: #999; cursor: pointer; }
        .modal-close:hover { color: #333; }

        .details-table-wrapper { overflow-x: auto; max-height: 70vh; }
        .details-table { width: 100%; min-width: 2000px; border-collapse: collapse; font-size: 12px; }
        .details-table th {
            background: #f5f5f5;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
            min-width: 80px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .details-table td { padding: 10px 12px; border-bottom: 1px solid #eee; white-space: nowrap; }
        .details-table tr:hover { background: #fafafa; }

        .detail-link { color: #667eea; cursor: pointer; text-decoration: underline; font-weight: 600; }
        .detail-link:hover { color: #764ba2; }
        .style-no-link { color: #667eea; cursor: pointer; text-decoration: underline; font-weight: 600; }
        .style-no-link:hover { color: #764ba2; }

        .details-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .details-modal.show {
            display: flex;
        }
        .details-modal-content {
            background: white;
            width: 95%;
            height: 90%;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }
        .details-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .details-modal-header h2 {
            font-size: 18px;
            color: #2c3e50;
        }
        .details-modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        .details-modal-close:hover {
            color: #333;
        }
        .details-modal-body {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .details-modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

    <div class="container">
        <div id="uploadScreen" class="screen active upload-screen">
            <div class="upload-card">
                <div class="upload-icon">📊</div>
                <div class="upload-title">QC 驗布統計</div>
                <div class="upload-description">請上傳 insprecord_QF Excel 檔案</div>

                <div class="file-input-label" id="fileLabel" onclick="selectFile()" style="cursor: pointer;">

                    <div id="fileName" class="file-name"></div>
                </div>

                <button class="btn-upload" id="analyzeBtn" disabled>開始分析</button>
            </div>
        </div>

        <div id="dashboardScreen" class="screen dashboard-screen">
            <div class="dashboard-header">
                <div class="header-top">
                    <div class="date-nav">
                        <button class="nav-btn" id="prevBtn">←</button>
                        <div class="date-display" id="dateDisplay">2026/09/16</div>
                        <button class="nav-btn" id="nextBtn">→</button>
                    </div>
                    <div class="header-right">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <div style="display: flex; gap: 6px;">
                                <button class="btn-data-type active" id="btnQc" data-type="qc">品管（前端）</button>
                                <button class="btn-data-type" id="btnSupplier" data-type="supplier">供應商（前端）</button>
                                <button class="btn-data-type" id="btnFactory" data-type="factory">工廠（後端）</button>
                            </div>
                            <div class="location-filter">
                                <label>供應地</label>
                                <select class="location-select" id="locationSelect">
                                    <option value="">全部</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn-back" id="backBtn">返回</button>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="sidebar">
                    <div class="sidebar-label">供應地</div>
                    <div class="sidebar-location" id="sidebarLocation">—</div>
                </div>

                <div class="cards-wrapper">
                    <div id="cardsContainer" class="cards-container"></div>
                </div>
            </div>
        </div>

        <div id="detailsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title" id="modalTitle">明細詳情</div>
                    <button class="modal-close" id="modalClose">&times;</button>
                </div>
                <div class="details-table-wrapper">
                    <table class="details-table" id="detailsTable">
                        <thead>
                            <tr>
                                <th>驗布日</th>
                                <th>客戶</th>
                                <th>款號</th>
                                <th>採購人員</th>
                                <th>供應商</th>
                                <th>供應地</th>
                                <th>採購單號</th>
                                <th>成衣產區</th>
                                <th>布種</th>
                                <th>染法</th>
                                <th>QC</th>
                                <th>顏色</th>
                                <th>單色結論</th>
                                <th>收料碼數</th>
                                <th>抽驗碼數</th>
                                <th>C級%</th>
                                <th>百碼扣點</th>
                                <th>百平方碼扣點</th>
                                <th>布疵</th>
                                <th>外觀</th>
                                <th>手感</th>
                                <th>緯斜</th>
                                <th>顏色</th>
                                <th>規格</th>
                                <th>其他</th>
                            </tr>
                        </thead>
                        <tbody id="detailsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="colorLotRollModal" class="details-modal">
            <div class="details-modal-content">
                <div class="details-modal-header">
                    <h2 id="colorLotRollTitle">各匹明細</h2>
                    <button class="details-modal-close" id="colorLotRollClose">&times;</button>
                </div>
                <div class="details-modal-body">
                    <iframe id="colorLotRollIframe"></iframe>
                </div>
            </div>
        </div>
    </div>

                if (rowDate !== targetDate) return;

                const dataType = row[COLUMNS.DATA_TYPE] || '';
                const loc = row[COLUMNS.LOCATION] || '未知';

                }));

        // IndexedDB 初始化
        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onerror = () => reject(req.error);
                req.onsuccess = () => resolve(req.result);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
            });
        }

            try {
                const db = await initDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(handle, 'lastFile');
                return true;
            } catch (err) {
                console.error('保存句柄失敗:', err);
                return false;
            }
        }

                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get('lastFile');
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            } catch (err) {
                console.error('讀取句柄失敗:', err);
                return null;
            }
        }

                // 檔案無法存取
                const retry = confirm('上次選擇的檔案無法存取（可能已被移動或刪除）。\n要重新選擇嗎？');
                if (retry) await selectFile();
                return false;
            }

            selectedFileHandle = handle;
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('analyzeBtn').disabled = false;
            return true;
        }

        // 頁面載入時試圖載入上次的檔案
        window.addEventListener('DOMContentLoaded', async () => {
            await tryLoadLastFile();
        });

        document.getElementById('analyzeBtn').addEventListener('click', () => {
            const file = selectedFile;
            if (!file) return;

            if (typeof XLSX === 'undefined') {
                alert('⚠️ 自動生成的 DailyQC 不需要上傳功能\n\n此版本已移除外部依賴以改善離線使用體驗。\n\n如需手動上傳 Excel，請使用原始模板版本。');
                return;
            }

            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];

                    // 讀取標頭和資料
                    const range = XLSX.utils.decode_range(ws['!ref']);
                    const headers = [];

                    for (let col = range.s.c; col <= range.e.c; col++) {
                      const cellRef = XLSX.utils.encode_cell({r: 0, c: col});
                      headers[col] = ws[cellRef]?.v || '';
                    }

                    rawData = [];
                    for (let row = range.s.r + 1; row <= range.e.r; row++) {
                      const obj = {};
                      for (let col = range.s.c; col <= range.e.c; col++) {
                        const cellRef = XLSX.utils.encode_cell({r: row, c: col});
                        obj[headers[col]] = ws[cellRef]?.v;
                      }
                      // 直接存儲採購單號和顏色
                      // 採購單號：尋找以 TMKF 或 CJYF 開頭的值
                      let poNum = '';
                      for (let c = 0; c <= range.e.c; c++) {
                        const val = ws[XLSX.utils.encode_cell({r: row, c: c})]?.v || '';
                        if (val && (String(val).startsWith('TMKF') || String(val).startsWith('CJYF'))) {
                          poNum = val;
                          break;
                        }
                      }
                      obj['__購單號__'] = poNum;
                      obj['__顏色__'] = ws[XLSX.utils.encode_cell({r: row, c: 23})]?.v || '';
                      rawData.push(obj);
                    }

                    console.log('✓ 資料載入成功:', rawData.length, '筆');

                    calculateDateRange();
                    updateLocationFilter();

                    document.getElementById('uploadScreen').classList.remove('active');
                    document.getElementById('dashboardScreen').classList.add('active');

                    updateDashboard();
                } catch (err) {
                    alert('解析失敗: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('dashboardScreen').classList.remove('active');
            document.getElementById('uploadScreen').classList.add('active');
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            const newDate = new Date(selectedDate);
            newDate.setDate(newDate.getDate() - 1);
            if (newDate >= dateRange.start) {
                selectedDate = newDate;
                updateDateDisplay();
                updateDashboard();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            const newDate = new Date(selectedDate);
            newDate.setDate(newDate.getDate() + 1);
            if (newDate <= dateRange.end) {
                selectedDate = newDate;
                updateDateDisplay();
                updateDashboard();
            }
        });

        document.getElementById('locationSelect').addEventListener('change', e => {
            selectedLocation = e.target.value;
            updateDashboard();
        });

        document.querySelectorAll('.btn-data-type').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.btn-data-type').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedDataType = e.target.dataset.type;
                updateDashboard();
            });
        });

        function showDetails(groupKey, custSupplier) {
            const targetDate = document.getElementById('dateDisplay').textContent.split(' ')[0];

            const filteredRecords = rawData.filter(row => {
                const date = parseExcelDate(row[COLUMNS.DATE]);
                if (!date) return false;
                const rowDate = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
                if (rowDate !== targetDate) return false;

                if (selectedDataType === 'supplier') {
                    // groupKey = 供應商；custSupplier = 客戶
                    if (row['供應商'] !== groupKey) return false;
                    if (row['客戶'] !== custSupplier) return false;
                } else {
                    // 根據字卡標題（QC 或 成衣產區）篩選
                    if (selectedDataType === 'qc') {
                        if (row[COLUMNS.QC] !== groupKey) return false;
                    } else {
                        if (row[COLUMNS.APPAREL_FACTORY] !== groupKey) return false;
                    }
                    // 再根據客戶/供應商篩選
                    const [cust, supp] = custSupplier.split('/');
                    if (row['客戶'] !== cust || row['供應商'] !== supp) return false;
                }
                return true;
            });

            // 排序：有C%的採購單號優先，同採購單號內按C%降序
            const poMaxC = {};
            filteredRecords.forEach(row => {
                const po = row['採購單號'] || '';
                const c = parseFloat(row['C級%']) || 0;
                if (!(po in poMaxC) || c > poMaxC[po]) poMaxC[po] = c;
            });
            filteredRecords.sort((a, b) => {
                const poA = a['採購單號'] || '', poB = b['採購單號'] || '';
                const maxA = poMaxC[poA] || 0, maxB = poMaxC[poB] || 0;
                if (maxB !== maxA) return maxB - maxA;
                if (poA !== poB) return poA.localeCompare(poB);
                return (parseFloat(b['C級%']) || 0) - (parseFloat(a['C級%']) || 0);
            });

            const tbody = document.getElementById('detailsTableBody');
            tbody.innerHTML = filteredRecords.map(row => {
                const date = parseExcelDate(row[COLUMNS.DATE]);
                const dateStr = date ? `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}` : '';
                const cPct = parseFloat(row['C級%']) || 0;

                // 只計算布面瑕疵的細項占比，取前三大
                const fabricDefects = {
                    '異纖/飛花': parseFloat(row['異纖/飛花']) || 0,
                    '棉粒/結頭/粗節': parseFloat(row['棉粒/結頭/粗節']) || 0,
                    '粗細紗': parseFloat(row['粗細紗']) || 0,
                    '織布瑕疵(漏針)': parseFloat(row['織布瑕疵(漏針)']) || 0,
                    '斷紗(斷經/斷緯)': parseFloat(row['斷紗(斷經/斷緯)']) || 0,
                    '橫檔/橫條': parseFloat(row['橫檔/橫條']) || 0,
                    '針痕/直條': parseFloat(row['針痕/直條']) || 0,
                    '染折/折痕': parseFloat(row['染折/折痕']) || 0,
                    '擦傷/刮傷/勾紗': parseFloat(row['擦傷/刮傷/勾紗']) || 0,
                    '油/髒/色污': parseFloat(row['油/髒/色污']) || 0,
                    '破洞': parseFloat(row['破洞']) || 0,
                    '接疋': parseFloat(row['接疋']) || 0,
                    '印花瑕疵': parseFloat(row['印花瑕疵']) || 0,
                    '風格不符': parseFloat(row['風格不符']) || 0,
                    '布面不平整': parseFloat(row['布面不平整']) || 0,
                    '起絨不良': parseFloat(row['起絨不良']) || 0
                };
                const totalFabricDefects = Object.values(fabricDefects).reduce((a, b) => a + b, 0);
                const defectPercent = Object.entries(fabricDefects)
                    .map(([name, count]) => ({ name, count, pct: totalFabricDefects > 0 ? (count / totalFabricDefects * 100) : 0 }))
                    .filter(d => d.count > 0)
                    .sort((a, b) => b.pct - a.pct)
                    .slice(0, 3)
                    .map(d => `${d.name}:${d.pct.toFixed(0)}%`)
                    .join(' ');

                const styleNo = row['款號'] || '-';
                const supplier = (row['供應商'] || '').replace(/'/g, "\\'");
                const conclusion = (row['單色結論'] || '').trim();
                const isFail = conclusion === 'Fail';
                const styleNoCell = styleNo === '-'
                    ? styleNo
                    : isFail
                        ? `<a href="#" class="style-no-link" onclick="queryColorLotRoll('${styleNo.replace(/'/g, "\\'")}','${supplier}'); return false;">${styleNo}</a>`
                        : styleNo;

                return `
                    <tr>
                        <td>${dateStr}</td>
                        <td>${row['客戶'] || '-'}</td>
                        <td>${styleNoCell}</td>
                        <td>${row['採購人員'] || '-'}</td>
                        <td>${row['供應商'] || '-'}</td>
                        <td>${row['供應地'] || '-'}</td>
                        <td>${row['__購單號__'] || '-'}</td>
                        <td>${row['成衣產區'] || '-'}</td>
                        <td>${row['布種'] || '-'}</td>
                        <td>${row['染法'] || '-'}</td>
                        <td>${row['QC'] || '-'}</td>
                        <td>${row['__顏色__'] || '-'}</td>
                        <td>${row['單色結論'] === 'Fail' ? '<span style="color:#dc2626;font-weight:700">Fail</span>' : (row['單色結論'] || '-')}</td>
                        <td>${row['收料碼數'] ? Math.round(parseFloat(row['收料碼數'])) : '-'}</td>
                        <td>${row['抽驗碼數'] ? Math.round(parseFloat(row['抽驗碼數'])) : '-'}</td>
                        <td>${(cPct * 100).toFixed(1)}%</td>
                        <td>${row['百碼瑕疵點數'] || '-'}</td>
                        <td>${row['百平方碼瑕疵點數'] || '-'}</td>
                        <td>${row['布面瑕疵'] || '-'}</td>
                        <td>${row['外觀問題'] || '-'}</td>
                        <td>${row['手感問題'] || '-'}</td>
                        <td>${row['緯斜問題'] || '-'}</td>
                        <td>${row['顏色問題'] || '-'}</td>
                        <td>${row['規格問題'] || '-'}</td>
                        <td>${row['其他問題'] || '-'}</td>
                    </tr>
                `;
            }).join('');

            // 檢查是否有 Fail 項目
            let hasFail = false;
            filteredRecords.forEach(row => {
                const defect = parseFloat(row['百碼瑕疵點數']) || 0;
                const cPct = parseFloat(row['C級%']) || 0;
                if (defect > 33 || cPct >= 0.20) {
                    hasFail = true;
                }
            });

            const modalTitle = document.getElementById('modalTitle');
            modalTitle.textContent = selectedDataType === 'supplier'
                ? `${groupKey}/${custSupplier} 明細（${filteredRecords.length}筆）`
                : `${custSupplier} 明細（${filteredRecords.length}筆）`;
            modalTitle.style.color = '#2c3e50';
            modalTitle.style.fontWeight = '700';
            document.getElementById('detailsModal').classList.add('show');
        }

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('detailsModal').classList.remove('show');
        });

        function escapeHtml(s) {
            return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
        }

        function queryColorLotRoll(styleNo, supplier) {
            const entry = ROLL_INDEX[styleNo + '|' + supplier];
            const frame = document.getElementById('colorLotRollIframe');
            document.getElementById('colorLotRollTitle').textContent = `各匹明細 Roll - ${styleNo} / ${supplier}`;

            if (entry && entry.html) {
                frame.srcdoc = entry.html;
            } else {
                const msg = entry
                    ? `此款號未嵌入（已超過附件上限）。<br>請至：${escapeHtml(entry.dir + '\\' + entry.file)}`
                    : '尚無對應的各匹明細檔，請先生成。';
                frame.srcdoc = `<body style="font-family:'Microsoft JhengHei',sans-serif;padding:24px;color:#555">${msg}</body>`;
            }
            document.getElementById('colorLotRollModal').classList.add('show');
        }

        document.getElementById('colorLotRollClose').addEventListener('click', () => {
            document.getElementById('colorLotRollModal').classList.remove('show');
        });

        document.getElementById('colorLotRollModal').addEventListener('click', e => {
            if (e.target.id === 'colorLotRollModal') {
                document.getElementById('colorLotRollModal').classList.remove('show');
            }
        });

        document.getElementById('detailsModal').addEventListener('click', e => {
            if (e.target.id === 'detailsModal') {
                document.getElementById('detailsModal').classList.remove('show');
            }
        });
    
        window.addEventListener('DOMContentLoaded', function() {
            if (typeof AUTO_DATA !== 'undefined' && AUTO_DATA.length > 0) {
                rawData = AUTO_DATA;
                document.getElementById('uploadScreen').classList.remove('active');
                document.getElementById('dashboardScreen').classList.add('active');
                var hdr = document.querySelector('.dashboard-header');
                if (hdr) {
                    var info = document.createElement('div');
                    info.style.cssText = 'font-size:11px;color:#999;text-align:right;padding-top:4px;';
                    info.textContent = '\u8cc7\u6599\u671f\u9593: ' + AUTO_PERIOD + '  \u7522\u51fa: ' + AUTO_GENERATED;
                    hdr.appendChild(info);
                }
                calculateDateRange();
                updateLocationFilter();
                updateDashboard();
            }
        });

    </script>
</body>
</html>
